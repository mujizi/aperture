<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Aperture settings overview</title>
  <desc id="desc">A visual overview of Aperture settings grouped into capture, reading, and attention model controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f4"/>
      <stop offset="1" stop-color="#edf2f1"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24302f" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="30" fill="url(#bg)"/>
  <text x="52" y="58" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">设置控制三件事</text>
  <text x="52" y="87" fill="#66716f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Capture, reading experience, and the model that performs the attention pass.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="122" width="336" height="287" rx="24" fill="#ffffff"/>
    <circle cx="90" cy="166" r="20" fill="#eaf3ef"/>
    <path d="M81 166h18M90 157v18" stroke="#4c8a72" stroke-width="2" stroke-linecap="round"/>
    <text x="122" y="163" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">采集</text>
    <text x="122" y="184" fill="#71807d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">CAPTURE</text>
    <text x="78" y="234" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">监控</text>
    <text x="78" y="257" fill="#65706e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">随时暂停或恢复新轮次采集</text>
    <rect x="298" y="226" width="56" height="30" rx="15" fill="#2388ed"/>
    <circle cx="339" cy="241" r="11" fill="#ffffff"/>
    <line x1="78" y1="288" x2="362" y2="288" stroke="#e7ebe9"/>
    <text x="78" y="328" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">语言</text>
    <text x="78" y="351" fill="#65706e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">界面、提示词与新结果同步切换</text>
    <rect x="284" y="317" width="70" height="28" rx="8" fill="#eef2f1"/>
    <text x="319" y="336" fill="#46504f" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">CN / EN</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="432" y="122" width="336" height="287" rx="24" fill="#ffffff"/>
    <circle cx="470" cy="166" r="20" fill="#e8eef8"/>
    <path d="M461 166c5-8 13-8 18 0-5 8-13 8-18 0z" fill="none" stroke="#5276a5" stroke-width="1.8"/>
    <circle cx="470" cy="166" r="3" fill="#5276a5"/>
    <text x="502" y="163" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">阅读</text>
    <text x="502" y="184" fill="#71807d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">READING</text>
    <text x="458" y="234" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">聚焦</text>
    <text x="458" y="257" fill="#65706e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">细节</text>
    <text x="716" y="257" fill="#65706e" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">核心</text>
    <line x1="500" y1="252" x2="674" y2="252" stroke="#bcc8c5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="620" cy="252" r="10" fill="#5e7f7a"/>
    <line x1="458" y1="288" x2="742" y2="288" stroke="#e7ebe9"/>
    <text x="458" y="328" fill="#202625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">外观 · 字号</text>
    <text x="458" y="351" fill="#65706e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">浅色 / 深色与多档阅读尺寸</text>
    <circle cx="688" cy="331" r="13" fill="#26302f"/>
    <text x="718" y="337" fill="#26302f" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="700">A</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="812" y="122" width="336" height="287" rx="24" fill="#202625"/>
    <circle cx="850" cy="166" r="20" fill="#f5eddd"/>
    <path d="M841 168c4-12 14-12 18 0M844 159h12" fill="none" stroke="#a67a31" stroke-width="1.8" stroke-linecap="round"/>
    <text x="882" y="163" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">注意力模型</text>
    <text x="882" y="184" fill="#aeb9b6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">ATTENTION MODEL</text>
    <text x="838" y="234" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">OpenRouter</text>
    <text x="838" y="257" fill="#b9c3c1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">API Key · 模型 · 刷新 · 连接测试</text>
    <line x1="838" y1="288" x2="1122" y2="288" stroke="#3b4544"/>
    <text x="838" y="328" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">Prompt</text>
    <text x="838" y="351" fill="#b9c3c1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">定义什么先被看见，影响之后的结果</text>
    <rect x="838" y="370" width="284" height="12" rx="6" fill="#ffffff" fill-opacity=".10"/>
    <rect x="838" y="370" width="178" height="12" rx="6" fill="#9db2ac"/>
  </g>

  <text x="600" y="448" fill="#71807d" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">设置只影响之后的采集、显示或生成；已保存的 AttentionScene 不会被悄悄改写。</text>
</svg>
